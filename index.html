<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aaru Bot 💜</title>

<style>
/* Base Styles */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', sans-serif;
}

body {
  display: flex;
  height: 100vh;
  background: linear-gradient(135deg, #f5f3ff, #ede9fe, #e0c3fc);
}

/* Sidebar */
.sidebar {
  width: 260px;
  background: rgba(30, 27, 46, 0.95);
  backdrop-filter: blur(10px);
  color: white;
  padding: 20px;
  box-shadow: 4px 0 20px rgba(0,0,0,0.2);
  display: flex;
  flex-direction: column;
  transition: all 0.3s ease;
}

.sidebar h2 {
  color: #d8b4fe;
  margin-bottom: 20px;
  font-size: 1.5rem;
}

.new-chat {
  width: 100%;
  padding: 10px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(135deg, #b57edc, #9333ea);
  color: white;
  cursor: pointer;
  margin-bottom: 15px;
  font-size: 1rem;
}

.chat-item {
  padding: 10px;
  margin-top: 8px;
  background: rgba(255,255,255,0.05);
  border-radius: 10px;
  cursor: pointer;
  transition: 0.2s;
  font-size: 0.95rem;
}

.chat-item:hover {
  background: #6d28d9;
  transform: scale(1.03);
}

/* Main area */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  transition: all 0.3s ease;
}

/* Header */
.header {
  padding: 15px;
  background: rgba(255,255,255,0.7);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid #ddd;
  color: #6b21a8;
  font-weight: bold;
  font-size: 1.2rem;
}

/* Chat area */
.chat {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
  scroll-behavior: smooth;
}

/* Messages */
.message {
  margin-bottom: 12px;
}

.user {
  text-align: right;
}

.bubble {
  display: inline-block;
  padding: 12px 16px;
  border-radius: 16px;
  max-width: 65%;
  transition: 0.2s;
  word-wrap: break-word;
}

.bubble:hover {
  transform: scale(1.03);
}

.user .bubble {
  background: linear-gradient(135deg, #b57edc, #9333ea);
  color: white;
}

.bot .bubble {
  background: white;
  box-shadow: 0 4px 10px rgba(0,0,0,0.05);
}

/* Input area */
.input-area {
  display: flex;
  padding: 12px;
  background: rgba(255,255,255,0.7);
  backdrop-filter: blur(10px);
}

input {
  flex: 1;
  padding: 12px;
  border-radius: 12px;
  border: 1px solid #ccc;
  outline: none;
  font-size: 1rem;
}

input:focus {
  border-color: #9333ea;
  box-shadow: 0 0 5px rgba(147,51,234,0.4);
}

button.send {
  margin-left: 10px;
  padding: 12px 16px;
  border: none;
  border-radius: 12px;
  background: linear-gradient(135deg, #b57edc, #9333ea);
  color: white;
  cursor: pointer;
  font-size: 1rem;
}

button.send:hover {
  opacity: 0.9;
}

/* Scrollbar styling */
.chat::-webkit-scrollbar {
  width: 8px;
}

.chat::-webkit-scrollbar-thumb {
  background: rgba(147,51,234,0.4);
  border-radius: 4px;
}

/* Responsive styles */
@media (max-width: 1024px) { /* tablets */
  .sidebar {
    width: 200px;
    padding: 15px;
  }
  .chat-item {
    font-size: 0.9rem;
  }
  .header {
    font-size: 1.1rem;
  }
}

@media (max-width: 768px) { /* small tablets / landscape phones */
  body {
    flex-direction: column;
  }
  .sidebar {
    width: 100%;
    flex-direction: row;
    overflow-x: auto;
    padding: 10px;
  }
  .sidebar h2 {
    font-size: 1.2rem;
    margin-right: 15px;
  }
  .new-chat {
    margin-right: 10px;
    margin-bottom: 0;
    font-size: 0.9rem;
  }
  .chat-item {
    display: inline-block;
    margin: 0 8px;
  }
  .main {
    flex: 1;
    height: calc(100vh - 60px);
  }
  .header {
    font-size: 1rem;
  }
}

@media (max-width: 480px) { /* mobile */
  .input-area {
    flex-direction: column;
  }
  input {
    margin-bottom: 10px;
    font-size: 0.95rem;
  }
  button.send {
    margin-left: 0;
    font-size: 0.95rem;
  }
  .bubble {
    max-width: 80%;
    font-size: 0.9rem;
  }
}
</style>
</head>

<body>
<!-- Sidebar -->
<div class="sidebar">
  <h2>💜 Aaru Bot</h2>
  <button class="new-chat" onclick="newChat()">+ New Chat</button>
  <div id="chatList"></div>
</div>

<!-- Main -->
<div class="main">
  <div class="header">Aaru Bot - Smart Assistant</div>
  <div class="chat" id="chat"></div>
  <div class="input-area">
    <input id="msg" placeholder="Message Aaru Bot..." />
    <button class="send" onclick="send()">Send</button>
  </div>
</div>

<script>
// Chats
let chats = [];
let currentChat = 0;

// Predefined replies
const predefinedReplies = [
  { keywords: ["hello", "hi", "hey"], reply: "Heyy 💜 I'm Aaru!, Smarter aaru with zero nakhre" },
  { keywords: ["kaise hai","how are you"], reply: "badhiya and sexy as always💜 tu bta kaisa hai" },
  { keywords: ["thik", "badhiya", "mast"], reply: "gr8 dude.........tu bta!!!" },
  { keywords: ["colour"], reply: "Lavender paglu" },
  { keywords: ["love"], reply: "Drawing, yepping, mandalas, nature, space, galaxy, ocean, animals" },
  { keywords: ["instagram"], reply: "virtuoso_infinity" },
  { keywords: ["kya kar rahi hai", "kya kar rahe ho", "kya kar rahe hain"], reply: "kuch nhi bus iss duniya me survive" },
  { keywords: ["who are you", "what is your name", "what are you","kon ho tum"], reply: "I'm Aaru, your smart assistant 🤖" },
  { keywords: ["creator", "developer", "owner", "founder", "builder", "create"], reply: "I was created by Vaibhav 😎🔥" },
  { keywords: ["project"], reply: "to make something that have zero nakhre and always available 🔥" }
];

// Backend API URL
const API_URL = "https://aaru-bot-main.onrender.com/chat";

// Create first chat
newChat();

function newChat() {
  chats.push([]);
  currentChat = chats.length - 1;
  renderChats();
  renderMessages();
}

function renderChats() {
  const list = document.getElementById("chatList");
  list.innerHTML = "";
  chats.forEach((c, i) => {
    const div = document.createElement("div");
    div.className = "chat-item";
    div.innerText = "Chat " + (i + 1);
    div.onclick = () => { currentChat = i; renderMessages(); };
    list.appendChild(div);
  });
}

function renderMessages() {
  const chatDiv = document.getElementById("chat");
  chatDiv.innerHTML = "";
  chats[currentChat].forEach(m => { add(m.text, m.role); });
}

function add(text, type) {
  const chat = document.getElementById("chat");
  const msg = document.createElement("div");
  msg.className = "message " + (type === "user" ? "user" : "bot");
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.innerText = text;
  msg.appendChild(bubble);
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
}

function getPredefinedReply(input) {
  input = input.toLowerCase();
  for (let item of predefinedReplies) {
    for (let word of item.keywords) {
      if (input.includes(word)) return item.reply;
    }
  }
  return null;
}

async function send() {
  const input = document.getElementById("msg");
  const text = input.value.trim();
  if (!text) return;

  add(text, "user");
  chats[currentChat].push({ role: "user", text });
  input.value = "";

  add("Typing...", "bot");

  const predefined = getPredefinedReply(text);
  if (predefined) {
    document.querySelector(".bot:last-child").remove();
    add(predefined, "bot");
    chats[currentChat].push({ role: "model", text: predefined });
    return;
  }

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: chats[currentChat] })
    });
    if (!res.ok) throw new Error("Backend error");
    const data = await res.json();
    document.querySelector(".bot:last-child").remove();
    add(data.reply || "Oops! No response", "bot");
    chats[currentChat].push({ role: "model", text: data.reply || "Oops! No response" });
  } catch (err) {
    document.querySelector(".bot:last-child").remove();
    add("⚠️ Backend not reachable", "bot");
    console.error(err);
  }
}

document.getElementById("msg").addEventListener("keydown", function(e) {
  if (e.key === "Enter") send();
});
</script>

</body>
</html>
