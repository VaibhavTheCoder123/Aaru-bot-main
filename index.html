<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aaru Bot 💜</title>

<style>
/* Base Styles */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', sans-serif;
}

body {
  height: 100vh;
  background: linear-gradient(135deg, #f5f3ff, #ede9fe, #e0c3fc);
  display: flex;
  justify-content: center;
  align-items: center;
}

/* Container */
.container {
  width: 100%;
  max-width: 1000px;
  height: 90vh;
  background: rgba(255, 255, 255, 0.95);
  border-radius: 20px;
  display: flex;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  overflow: hidden;
}

/* Sidebar */
.sidebar {
  width: 280px;
  background: linear-gradient(135deg, #9333ea, #6b21a8);
  color: white;
  display: flex;
  flex-direction: column;
  padding: 20px;
}

.sidebar h2 {
  color: #fff;
  margin-bottom: 20px;
  text-align: center;
}

.new-chat {
  padding: 12px;
  border-radius: 12px;
  background: linear-gradient(135deg, #b57edc, #9333ea);
  border: none;
  color: white;
  font-weight: bold;
  cursor: pointer;
  margin-bottom: 15px;
  transition: 0.2s;
}

.new-chat:hover {
  transform: scale(1.03);
}

#chatList {
  flex: 1;
  overflow-y: auto;
}

.chat-item {
  padding: 10px;
  margin-bottom: 8px;
  background: rgba(255,255,255,0.1);
  border-radius: 10px;
  cursor: pointer;
  transition: 0.2s;
}

.chat-item:hover {
  background: rgba(255,255,255,0.3);
  transform: scale(1.02);
}

/* Main Chat Area */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
}

/* Header */
.header {
  padding: 16px;
  font-weight: bold;
  font-size: 1.2rem;
  background: linear-gradient(135deg, #b57edc, #9333ea);
  color: white;
  text-align: center;
}

/* Chat messages */
.chat {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
  scroll-behavior: smooth;
  background: #f9f7fe;
}

/* Messages */
.message {
  display: flex;
  flex-direction: column;
  max-width: 70%;
}

.user {
  align-self: flex-end;
  text-align: right;
}

.bot {
  align-self: flex-start;
  text-align: left;
}

.bubble {
  padding: 14px 20px;
  border-radius: 25px;
  font-size: 0.95rem;
  word-wrap: break-word;
  box-shadow: 0 4px 10px rgba(0,0,0,0.05);
  transition: transform 0.2s;
}

.user .bubble {
  background: linear-gradient(135deg, #b57edc, #9333ea);
  color: white;
  border-bottom-right-radius: 5px;
}

.bot .bubble {
  background: #fff;
  color: #333;
  border-bottom-left-radius: 5px;
}

/* Input area */
.input-area {
  display: flex;
  padding: 12px 16px;
  background: #fff;
  border-top: 1px solid #ddd;
  gap: 10px;
}

input {
  flex: 1;
  padding: 12px 16px;
  border-radius: 25px;
  border: 1px solid #ccc;
  outline: none;
  font-size: 1rem;
  transition: all 0.2s;
}

input:focus {
  border-color: #9333ea;
  box-shadow: 0 0 5px rgba(147,51,234,0.4);
}

button.send {
  padding: 12px 18px;
  border-radius: 25px;
  border: none;
  background: linear-gradient(135deg, #b57edc, #9333ea);
  color: white;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.2s;
}

button.send:hover {
  opacity: 0.9;
  transform: scale(1.05);
}

/* Scrollbar */
.chat::-webkit-scrollbar, #chatList::-webkit-scrollbar {
  width: 6px;
}

.chat::-webkit-scrollbar-thumb, #chatList::-webkit-scrollbar-thumb {
  background: rgba(147,51,234,0.4);
  border-radius: 3px;
}

/* Responsive */
@media (max-width: 768px) {
  .container {
    flex-direction: column;
    height: 95vh;
    width: 95%;
  }
  .sidebar {
    width: 100%;
    flex-direction: row;
    justify-content: space-between;
    padding: 10px 16px;
  }
  #chatList {
    display: none;
  }
  .main {
    flex: 1;
  }
}
</style>
</head>
<body>

<div class="container">
  <!-- Sidebar -->
  <div class="sidebar">
    <h2>💜 Aaru Bot</h2>
    <button class="new-chat" onclick="newChat()">+ New Chat</button>
    <div id="chatList"></div>
  </div>

  <!-- Main Chat Area -->
  <div class="main">
    <div class="header">Aaru Bot - Smart Assistant</div>
    <div class="chat" id="chat"></div>
    <div class="input-area">
      <input id="msg" placeholder="Message Aaru Bot..." />
      <button class="send" onclick="send()">Send</button>
    </div>
  </div>
</div>

<script>
// Chats
let chats = [];
let currentChat = 0;

// Predefined replies
const predefinedReplies = [
  { keywords: ["hello", "hi", "hey"], reply: "Heyy 💜 I'm Aaru!, Smarter aaru with zero nakhre" },
  { keywords: ["kaise hai","how are you"], reply: "badhiya and sexy as always💜 tu bta kaisa hai" },
  { keywords: ["thik", "badhiya", "mast"], reply: "gr8 dude.........tu bta!!!" },
  { keywords: ["colour"], reply: "Lavender paglu" },
  { keywords: ["love"], reply: "Drawing, yepping, mandalas, nature, space, galaxy, ocean, animals" },
  { keywords: ["instagram"], reply: "virtuoso_infinity" },
  { keywords: ["kya kar rahi hai", "kya kar rahe ho", "kya kar rahe hain"], reply: "kuch nhi bus iss duniya me survive" },
  { keywords: ["who are you", "what is your name", "what are you","kon ho tum","naam"], reply: "I'm Aaru, your smart assistant 🤖" },
  { keywords: ["creator", "developer", "owner", "founder", "builder", "create"], reply: "I was created by Vaibhav 😎🔥" },
  { keywords: ["project"], reply: "to make something that have zero nakhre and always available 🔥" }
];

const API_URL = "https://aaru-bot-main.onrender.com/chat";

newChat();

function newChat() {
  chats.push([]);
  currentChat = chats.length - 1;
  renderChats();
  renderMessages();
}

function renderChats() {
  const list = document.getElementById("chatList");
  list.innerHTML = "";
  chats.forEach((c, i) => {
    const div = document.createElement("div");
    div.className = "chat-item";
    div.innerText = "Chat " + (i + 1);
    div.onclick = () => { currentChat = i; renderMessages(); };
    list.appendChild(div);
  });
}

function renderMessages() {
  const chatDiv = document.getElementById("chat");
  chatDiv.innerHTML = "";
  chats[currentChat].forEach(m => { add(m.text, m.role); });
}

function add(text, type) {
  const chat = document.getElementById("chat");
  const msg = document.createElement("div");
  msg.className = "message " + (type === "user" ? "user" : "bot");
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.innerText = text;
  msg.appendChild(bubble);
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
}

function getPredefinedReply(input) {
  input = input.toLowerCase();
  for (let item of predefinedReplies) {
    for (let word of item.keywords) {
      if (input.includes(word)) return item.reply;
    }
  }
  return null;
}

async function send() {
  const input = document.getElementById("msg");
  const text = input.value.trim();
  if (!text) return;
  add(text, "user");
  chats[currentChat].push({ role: "user", text });
  input.value = "";
  add("Typing...", "bot");

  const predefined = getPredefinedReply(text);
  if (predefined) {
    document.querySelector(".bot:last-child").remove();
    add(predefined, "bot");
    chats[currentChat].push({ role: "model", text: predefined });
    return;
  }

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: chats[currentChat] })
    });
    if (!res.ok) throw new Error("Backend error");
    const data = await res.json();
    document.querySelector(".bot:last-child").remove();
    add(data.reply || "Oops! No response", "bot");
    chats[currentChat].push({ role: "model", text: data.reply || "Oops! No response" });
  } catch (err) {
    document.querySelector(".bot:last-child").remove();
    add("⚠️ Backend not reachable", "bot");
    console.error(err);
  }
}

document.getElementById("msg").addEventListener("keydown", function(e) {
  if (e.key === "Enter") send();
});
</script>

</body>
</html>
