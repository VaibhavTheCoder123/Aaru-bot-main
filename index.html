<!DOCTYPE html>
<html>
<head>
<title>Aaru Bot 💜</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', sans-serif;
}

body {
  display: flex;
  height: 100vh;
  background: linear-gradient(135deg, #f5f3ff, #ede9fe, #e0c3fc);
}

/* Sidebar */
.sidebar {
  width: 260px;
  background: rgba(30, 27, 46, 0.95);
  backdrop-filter: blur(10px);
  color: white;
  padding: 20px;
  box-shadow: 4px 0 20px rgba(0,0,0,0.2);
}

.sidebar h2 {
  color: #d8b4fe;
  margin-bottom: 20px;
}

.new-chat {
  width: 100%;
  padding: 10px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(135deg, #b57edc, #9333ea);
  color: white;
  cursor: pointer;
  margin-bottom: 15px;
}

.chat-item {
  padding: 10px;
  margin-top: 8px;
  background: rgba(255,255,255,0.05);
  border-radius: 10px;
  cursor: pointer;
  transition: 0.2s;
}

.chat-item:hover {
  background: #6d28d9;
  transform: scale(1.03);
}

/* Main */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
}

/* Header */
.header {
  padding: 15px;
  background: rgba(255,255,255,0.7);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid #ddd;
  color: #6b21a8;
  font-weight: bold;
}

/* Chat Area */
.chat {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
}

/* Messages */
.message {
  margin-bottom: 12px;
}

.user {
  text-align: right;
}

.bubble {
  display: inline-block;
  padding: 12px 16px;
  border-radius: 16px;
  max-width: 65%;
  transition: 0.2s;
}

.bubble:hover {
  transform: scale(1.03);
}

/* User */
.user .bubble {
  background: linear-gradient(135deg, #b57edc, #9333ea);
  color: white;
}

/* Bot */
.bot .bubble {
  background: white;
  box-shadow: 0 4px 10px rgba(0,0,0,0.05);
}

/* Input */
.input-area {
  display: flex;
  padding: 12px;
  background: rgba(255,255,255,0.7);
  backdrop-filter: blur(10px);
}

input {
  flex: 1;
  padding: 12px;
  border-radius: 12px;
  border: 1px solid #ccc;
  outline: none;
}

input:focus {
  border-color: #9333ea;
  box-shadow: 0 0 5px rgba(147,51,234,0.4);
}

button.send {
  margin-left: 10px;
  padding: 12px 16px;
  border: none;
  border-radius: 12px;
  background: linear-gradient(135deg, #b57edc, #9333ea);
  color: white;
  cursor: pointer;
}

button.send:hover {
  opacity: 0.9;
}

</style>
</head>

<body>

<!-- Sidebar -->
<div class="sidebar">
  <h2>💜 Aaru Bot</h2>
  <button class="new-chat" onclick="newChat()">+ New Chat</button>
  <div id="chatList"></div>
</div>

<!-- Main -->
<div class="main">

  <div class="header">Aaru Bot - Smart Assistant</div>

  <div class="chat" id="chat"></div>

  <div class="input-area">
    <input id="msg" placeholder="Message Aaru Bot..." />
    <button class="send" onclick="send()">Send</button>
  </div>

</div>

<script>

// Chats
let chats = [];
let currentChat = 0;

// Predefined replies
const predefinedReplies = [
  { keywords: ["hello","hi","hey"], reply: "Heyy 💜 I'm Aaru Bot!" },
  { keywords: ["who are you"], reply: "I'm Aaru Bot, your smart assistant 🤖" },
  { keywords: ["creator"], reply: "I was created by Vaibhav 😎🔥" },
  { keywords: ["project"], reply: "You're building something awesome 🔥" }
];

// Create first chat
newChat();

function newChat() {
  chats.push([]);
  currentChat = chats.length - 1;
  renderChats();
  renderMessages();
}

function renderChats() {
  const list = document.getElementById("chatList");
  list.innerHTML = "";

  chats.forEach((c, i) => {
    const div = document.createElement("div");
    div.className = "chat-item";
    div.innerText = "Chat " + (i + 1);
    div.onclick = () => {
      currentChat = i;
      renderMessages();
    };
    list.appendChild(div);
  });
}

function renderMessages() {
  const chatDiv = document.getElementById("chat");
  chatDiv.innerHTML = "";

  chats[currentChat].forEach(m => {
    add(m.text, m.role);
  });
}

function add(text, type) {
  const chat = document.getElementById("chat");

  const msg = document.createElement("div");
  msg.className = "message " + (type === "user" ? "user" : "bot");

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.innerText = text;

  msg.appendChild(bubble);
  chat.appendChild(msg);

  chat.scrollTop = chat.scrollHeight;
}

// Predefined checker
function getPredefinedReply(input) {
  input = input.toLowerCase();

  for (let item of predefinedReplies) {
    for (let word of item.keywords) {
      if (input.includes(word)) {
        return item.reply;
      }
    }
  }
  return null;
}

// Send message
async function send() {
  const input = document.getElementById("msg");
  const text = input.value.trim();
  if (!text) return;

  add(text, "user");
  chats[currentChat].push({ role: "user", text });

  input.value = "";

  add("Typing...", "bot");

  // Predefined
  const predefined = getPredefinedReply(text);
  if (predefined) {
    document.querySelector(".bot:last-child").remove();
    add(predefined, "bot");
    chats[currentChat].push({ role: "model", text: predefined });
    return;
  }

  // API call
  const res = await fetch("http://localhost:3000/chat", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      messages: chats[currentChat]
    })
  });

  const data = await res.json();

  document.querySelector(".bot:last-child").remove();

  add(data.reply, "bot");

  chats[currentChat].push({ role: "model", text: data.reply });
}

// Enter key support
document.getElementById("msg").addEventListener("keydown", function(e) {
  if (e.key === "Enter") send();
});

</script>

</body>
</html>
