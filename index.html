<!DOCTYPE html>
<html>
<head>
<title>Aaru Bot</title>

<style>
body {
  margin: 0;
  display: flex;
  height: 100vh;
  font-family: Arial;
  background: #f5f3ff;
}

/* Sidebar */
.sidebar {
  width: 260px;
  background: #1e1b2e;
  color: white;
  padding: 15px;
}

.sidebar h2 {
  color: #d8b4fe;
}

.chat-item {
  padding: 10px;
  margin-top: 10px;
  background: #2a2545;
  border-radius: 8px;
  cursor: pointer;
}

.chat-item:hover {
  background: #3b2f6b;
}

.new-chat {
  margin-top: 15px;
  padding: 10px;
  background: #b57edc;
  border: none;
  color: white;
  border-radius: 8px;
  width: 100%;
  cursor: pointer;
}

/* Main */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
}

.header {
  padding: 15px;
  background: white;
  border-bottom: 1px solid #ddd;
  color: #6b21a8;
  font-weight: bold;
}

.chat {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
}

/* Messages */
.message {
  margin-bottom: 10px;
}

.user { text-align: right; }

.bubble {
  display: inline-block;
  padding: 10px;
  border-radius: 12px;
  max-width: 60%;
}

.user .bubble {
  background: #b57edc;
  color: white;
}

.bot .bubble {
  background: #ede9fe;
}

/* Input */
.input-area {
  display: flex;
  padding: 10px;
  background: white;
}

input {
  flex: 1;
  padding: 10px;
}

button.send {
  background: #b57edc;
  color: white;
  border: none;
  padding: 10px;
}
</style>
</head>

<body>

<div class="sidebar">
  <h2>💜 Aaru Bot</h2>
  <button class="new-chat" onclick="newChat()">+ New Chat</button>
  <div id="chatList"></div>
</div>

<div class="main">
  <div class="header">Aaru Bot</div>

  <div class="chat" id="chat"></div>

  <div class="input-area">
    <input id="msg" placeholder="Type...">
    <button class="send" onclick="send()">Send</button>
  </div>
</div>

<script>

let chats = [];
let currentChat = 0;

// Create first chat
newChat();

function newChat() {
  chats.push([]);
  currentChat = chats.length - 1;
  renderChats();
  renderMessages();
}

function renderChats() {
  const list = document.getElementById("chatList");
  list.innerHTML = "";

  chats.forEach((c, i) => {
    const div = document.createElement("div");
    div.className = "chat-item";
    div.innerText = "Chat " + (i + 1);
    div.onclick = () => {
      currentChat = i;
      renderMessages();
    };
    list.appendChild(div);
  });
}

function renderMessages() {
  const chatDiv = document.getElementById("chat");
  chatDiv.innerHTML = "";

  chats[currentChat].forEach(m => {
    add(m.text, m.role);
  });
}

function add(text, type) {
  const chat = document.getElementById("chat");

  const msg = document.createElement("div");
  msg.className = "message " + (type === "user" ? "user" : "bot");

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.innerText = text;

  msg.appendChild(bubble);
  chat.appendChild(msg);
}

async function send() {
  const input = document.getElementById("msg");
  const text = input.value.trim();
  if (!text) return;

  add(text, "user");

  chats[currentChat].push({ role: "user", text });

  input.value = "";

  add("Typing...", "bot");

  const res = await fetch("http://localhost:3000/chat", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      messages: chats[currentChat]
    })
  });

  const data = await res.json();

  document.querySelector(".bot:last-child").remove();

  add(data.reply, "bot");

  chats[currentChat].push({ role: "model", text: data.reply });
}

</script>

</body>
</html>
