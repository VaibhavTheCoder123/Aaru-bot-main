<!DOCTYPE html>
<html>
<head>
<title>Aaru Bot</title>
<style>
body {
  font-family: Arial;
  background: #f5f3ff;
}

.chat {
  height: 80vh;
  overflow-y: auto;
  padding: 20px;
}

.input {
  display: flex;
}

input {
  flex: 1;
  padding: 10px;
}

button {
  padding: 10px;
  background: #b57edc;
  color: white;
  border: none;
}
</style>
</head>

<body>

<h2>💜 Aaru Bot</h2>

<div class="chat" id="chat"></div>

<div class="input">
  <input id="msg" placeholder="Type...">
  <button onclick="send()">Send</button>
</div>

<script>

async function send() {
  const input = document.getElementById("msg");
  const text = input.value;
  if (!text) return;

  add(text, "user");
  input.value = "";

  add("Typing...", "bot");

  const res = await fetch("http://localhost:3000/chat", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ message: text })
  });

  const data = await res.json();

  document.querySelector(".bot:last-child").remove();
  add(data.reply, "bot");
}

function add(text, type) {
  const div = document.createElement("div");
  div.innerText = (type === "user" ? "You: " : "Bot: ") + text;
  document.getElementById("chat").appendChild(div);
}

</script>

</body>
</html>
