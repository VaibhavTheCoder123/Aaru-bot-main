<!DOCTYPE html>
<html>
<head>
<title>Aaru Bot</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  display: flex;
  height: 100vh;
  background: #f5f3ff;
}

.sidebar {
  width: 250px;
  background: #1e1b2e;
  color: white;
  padding: 20px;
}

.main {
  flex: 1;
  display: flex;
  flex-direction: column;
}

.header {
  padding: 15px;
  background: white;
  border-bottom: 1px solid #ddd;
  color: #6b21a8;
  font-weight: bold;
}

.chat {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
}

.message {
  margin-bottom: 12px;
}

.user {
  text-align: right;
}

.bubble {
  display: inline-block;
  padding: 10px 14px;
  border-radius: 12px;
  max-width: 60%;
}

.user .bubble {
  background: #b57edc;
  color: white;
}

.bot .bubble {
  background: #ede9fe;
}

.input-area {
  display: flex;
  padding: 10px;
  background: white;
  border-top: 1px solid #ddd;
}

input {
  flex: 1;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

button {
  margin-left: 10px;
  padding: 10px 15px;
  background: #b57edc;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

button:hover {
  background: #9333ea;
}
</style>

</head>

<body>

<div class="sidebar">
  <h2>💜 Aaru Bot</h2>
  <button onclick="clearChat()">New Chat</button>
</div>

<div class="main">
  <div class="header">Aaru Bot - Smart Assistant</div>

  <div class="chat" id="chat"></div>

  <div class="input-area">
    <input id="msg" placeholder="Type a message...">
    <button onclick="send()">Send</button>
  </div>
</div>

<script>

// 🧠 CHAT MEMORY
let chatHistory = [];

// ENTER KEY SUPPORT
document.getElementById("msg").addEventListener("keydown", e => {
  if (e.key === "Enter") send();
});

// ADD MESSAGE
function add(text, type) {
  const chat = document.getElementById("chat");

  const msg = document.createElement("div");
  msg.className = "message " + type;

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.innerText = text;

  msg.appendChild(bubble);
  chat.appendChild(msg);

  chat.scrollTop = chat.scrollHeight;
}

// SEND MESSAGE
async function send() {
  const input = document.getElementById("msg");
  const text = input.value.trim();
  if (!text) return;

  add(text, "user");
  input.value = "";

  // Save user message
  chatHistory.push({
    role: "user",
    text: text
  });

  // Typing indicator
  add("Typing...", "bot");

  try {
    const res = await fetch("http://localhost:3000/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        messages: chatHistory
      })
    });

    const data = await res.json();

    // Remove typing
    document.querySelector(".bot:last-child").remove();

    add(data.reply, "bot");

    // Save bot reply
    chatHistory.push({
      role: "model",
      text: data.reply
    });

  } catch (error) {
    document.querySelector(".bot:last-child").remove();
    add("Server error 😢", "bot");
  }
}

// CLEAR CHAT
function clearChat() {
  chatHistory = [];
  document.getElementById("chat").innerHTML = "";
}

</script>

</body>
</html>
